<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
        }

        input {
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
            display: none;
        }

        .error {
            color: red;
            border-color: red;
            background-color: #ffeeee;
        }
    </style>
</head>

<body>
    <h1>Check Weather</h1>

    <form action="/dashboard" method="get">
        <div class="input-group">
            <label for="city">City Name:</label>
            <input type="text" id="city" name="city" placeholder="e.g. London" required>
        </div>

        <div class="input-group">
            <label for="country">Country Code (optional):</label>
            <input type="text" id="country" name="country" placeholder="e.g. US, UK (2-letter code)" maxlength="2">
        </div>

        <button type="submit" id="getWeatherBtn">Get Weather</button>
    </form>

    <div id="result"></div>

    <script src="/static/js/main.js"></script>
</body>

</html>
