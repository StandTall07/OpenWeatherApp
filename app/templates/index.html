<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
        }

        input {
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
            display: none;
        }

        .error {
            color: red;
            border-color: red;
            background-color: #ffeeee;
        }
    </style>
</head>

<body>
    <h1>Check Weather</h1>

    <form action="/dashboard" method="get">
        <div class="input-group">
            <label for="city">City Name:</label>
            <input type="text" id="city" name="city" placeholder="e.g. London" required>
        </div>

        <div class="input-group">
            <label for="country">Country Code (optional):</label>
            <input type="text" id="country" name="country" placeholder="e.g. US, UK (2-letter code)" maxlength="2">
        </div>

        <button type="submit" id="getWeatherBtn">Get Weather</button>
        <button type="button" id="geoBtn" onclick="getLocation()"
            style="margin-left: 10px; background-color: #2c2f48; color: white;">Use Current Location</button>
    </form>

    <div id="result"></div>
    <div id="geo-status" style="margin-top: 10px; color: #666;"></div>

    <script>
        function getLocation() {
            const statusDiv = document.getElementById('geo-status');
            if (navigator.geolocation) {
                statusDiv.textContent = "Locating...";
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                statusDiv.textContent = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            window.location.href = `/dashboard?lat=${lat}&lon=${lon}`;
        }

        function showError(error) {
            const statusDiv = document.getElementById('geo-status');
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    statusDiv.textContent = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusDiv.textContent = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    statusDiv.textContent = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    statusDiv.textContent = "An unknown error occurred.";
                    break;
            }
        }
    </script>

    <script src="/static/js/main.js"></script>
</body>

</html>
